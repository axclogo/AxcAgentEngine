name: "streaming-demo"
description: "流式输出 + thinking 展示"

runtime:
  max_rounds: 10
  thinking: "auto"
  workspace: "/tmp/axc-streaming"
  allowed_capabilities:
    - "python_exec"

system_prompt: |
  你是一个助手。回答问题时先思考再回答。

plugins:
  builtin_tools:
    enabled: true
    load: ["python_exec", "get_time"]

  tracing:
    enabled: true
    output: "log"
