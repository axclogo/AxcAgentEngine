[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axc-agent-engine"
version = "2.2.0"
description = "Agent execution engine with Plan-Observe-Replan (POR) and plugin architecture"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
	{name = "AxcTeam"},
]
keywords = [
	"agent", "ai-agent", "llm", "agent-framework", "plan-observe-replan",
	"react-agent", "tool-calling", "plugin-system", "openai-compatible",
	"multi-agent", "autonomous-agent", "ai-framework",
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
	"pydantic>=2.0,<3.0",
	"pydantic-graph>=1.102.0,<2.0",
	"httpx>=0.27.0,<0.29",
	"pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
	"pytest-cov>=5.0",
	"ruff>=0.5.0",
	"mypy>=1.10",
	"fastapi>=0.115.0",
	"build>=1.2.0",
	"twine>=5.0.0",
	"pip-audit>=2.7.0",
	"pre-commit>=4.0.0",
]
api = [
	"fastapi>=0.115.0",
	"uvicorn>=0.30.0",
]
knowledge = ["faiss-cpu>=1.8.0"]
workflow = [
	"burr>=0.40.2,<0.41",
]
all = [
	"axc-agent-engine[api,knowledge,workflow]",
]

[project.urls]
Homepage = "https://github.com/axclogo/AxcAgentEngine"
Documentation = "https://github.com/axclogo/AxcAgentEngine#readme"
Repository = "https://github.com/axclogo/AxcAgentEngine"
Issues = "https://github.com/axclogo/AxcAgentEngine/issues"

[project.scripts]
axc = "axc_agent_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["axc_agent_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["axc_agent_engine"]

[tool.coverage.report]
fail_under = 90
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
disable_error_code = ["attr-defined", "no-any-return", "arg-type", "union-attr", "call-overload", "misc", "return-value", "override", "index"]
# Relaxed mypy gate: structural errors caught, strict type annotations deferred.
# To tighten: remove codes from disable_error_code one at a time and fix.
